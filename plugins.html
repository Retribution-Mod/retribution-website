<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Plugins — Retribution</title>
    <meta name="description" content="Browse and install public plugins for Retribution.">
    <link rel="icon" type="image/png" href="https://retribution-assets.allyapp.workers.dev/icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="index.html">
                <img src="https://retribution-assets.allyapp.workers.dev/icon" alt="Retribution logo">
                <span>Retribution</span>
            </a>
            <nav class="main-nav" aria-label="Main">
                <a href="index.html">Home</a>
                <a href="downloads.html">Downloads</a>
                <a href="docs/index.html">Docs</a>
                <a href="plugins.html" class="active">Browse</a>
                <a href="deep-link.html">Deep Link</a>
                <a href="https://github.com/Retribution-Mod" target="_blank" rel="noopener">GitHub</a>
            </nav>
            <button class="mobile-menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>Plugin Browser</h1>
            <p>Browse public plugins from the community catalog. Tap install to copy a deep link or open it in Retribution.</p>
        </div>
    </section>

    <section class="section" id="browse-app">
        <div class="container">
            <nav style="margin-bottom: 1.5rem;">
                <a class="btn btn-sm btn-secondary" href="plugins.html" style="background: var(--bg-3);">Plugins</a>
                <a class="btn btn-sm btn-secondary" href="themes.html">Themes</a>
                <a class="btn btn-sm btn-secondary" href="fonts.html">Fonts</a>
            </nav>

            <input type="search" id="search" placeholder="Search plugins..." class="btn" style="width: 100%; text-align: left; margin-bottom: 1.5rem; background: var(--bg-0); border-color: var(--bg-2); color: var(--text-0);" autocomplete="off">

            <div class="download-grid" id="results" data-type="plugin" data-source="data/plugins-data.json">
                <p class="text-muted">Loading plugins...</p>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <p>
                <a href="https://github.com/Retribution-Mod">GitHub</a>
                <a href="docs/index.html">Docs</a>
                <a href="downloads.html">Downloads</a>
            </p>
            <p class="text-muted">Not affiliated with Discord. Use at your own risk.</p>
        </div>
    </footer>

    <script src="js/browse.js?v=2"></script>
</body>
</html>
